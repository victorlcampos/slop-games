<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slop-games</title>
<meta name="description" content="Games that run entirely in the browser, each one a single HTML file."
      data-pt-content="Jogos que rodam inteiros no navegador, cada um num único arquivo HTML."
      data-en-content="Games that run entirely in the browser, each one a single HTML file.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
<style>
  :root {
    --bg: #0c0d12;
    --card: #16181f;
    --card-hover: #1c1f28;
    --line: #262a36;
    --line-hover: #3f4557;
    --text: #e7e9ee;
    --text-dim: #949aab;
    --text-faint: #6b7183;
    --accent: #7dd3a8;
    --accent-bg: #2a4a3b;
    --warn: #e0b170;
    --warn-bg: #4a3a22;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: clamp(2rem, 6vw, 5rem) clamp(1rem, 5vw, 3rem) 4rem;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, #1b2340 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 90% 10%, #2a1d33 0%, transparent 70%);
    background-repeat: no-repeat;
    color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .hero {
    max-width: 1100px;
    margin: 0 auto clamp(2.5rem, 6vw, 4rem);
  }

  .hero__top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1.5rem;
  }

  .hero__title {
    margin: 0;
    font-size: clamp(2.6rem, 9vw, 4.5rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    background: linear-gradient(100deg, #fff 20%, #8fb4ff 60%, #c79bff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* the picker lines up with the cap height of the title, not its box */
  .langs { flex-shrink: 0; padding-top: 0.6rem; }

  .hero__sub {
    margin: 1rem 0 0;
    max-width: 46ch;
    color: var(--text-dim);
    font-size: clamp(1rem, 2.2vw, 1.15rem);
  }

  .hero__meta {
    margin-top: 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.5rem;
    color: var(--text-faint);
    font-size: 0.85rem;
  }

  .hero__meta strong { color: var(--text-dim); font-weight: 600; }

  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    gap: 1.25rem;
  }

  .card {
    display: flex;
    flex-direction: column;
    padding: 1.5rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: inherit;
    text-decoration: none;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
  }

  .card:hover,
  .card:focus-visible {
    background: var(--card-hover);
    border-color: var(--line-hover);
    transform: translateY(-3px);
    outline: none;
  }

  .card:focus-visible { box-shadow: 0 0 0 2px var(--accent); }

  .card__emoji {
    font-size: 2.5rem;
    line-height: 1;
    margin-bottom: 0.9rem;
  }

  .card__name {
    margin: 0 0 0.5rem;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .card__desc {
    margin: 0 0 1.1rem;
    color: var(--text-dim);
    font-size: 0.92rem;
    flex-grow: 1;
  }

  .card__tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 0 0 1.1rem;
    padding: 0;
    list-style: none;
  }

  .card__tags li {
    padding: 0.15rem 0.55rem;
    background: #21252f;
    border-radius: 100px;
    color: var(--text-faint);
    font-size: 0.73rem;
    letter-spacing: 0.02em;
  }

  .card__foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding-top: 0.9rem;
    border-top: 1px solid var(--line);
  }

  .card__libs {
    color: var(--text-faint);
    font-size: 0.78rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .badge {
    flex-shrink: 0;
    padding: 0.2rem 0.6rem;
    border-radius: 100px;
    font-size: 0.72rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .badge--offline { background: var(--accent-bg); color: var(--accent); }
  .badge--online { background: var(--warn-bg); color: var(--warn); }

  .footer {
    max-width: 1100px;
    margin: clamp(3rem, 8vw, 5rem) auto 0;
    padding-top: 2rem;
    border-top: 1px solid var(--line);
    color: var(--text-faint);
    font-size: 0.85rem;
  }

  .footer a { color: var(--text-dim); }
  .footer a:hover { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover, .card:focus-visible { transform: none; }
  }

  @media (max-width: 480px) {
    .hero__top { flex-direction: column-reverse; align-items: flex-end; gap: 0.5rem; }
    .langs { padding-top: 0; }
  }
</style>
</head>
<body>

  <header class="hero">
    <div class="hero__top">
      <h1 class="hero__title">slop&#8209;games</h1>
      <div class="langs" data-lang-picker></div>
    </div>
    <p class="hero__sub"
       data-pt="Jogos que rodam inteiros no navegador. Cada um é um único arquivo HTML — sem servidor, sem instalação, sem conta."
       data-en="Games that run entirely in the browser. Each one is a single HTML file — no server, no install, no account.">Games that run entirely in the browser. Each one is a single HTML file — no server, no install, no account.</p>
    <div class="hero__meta">
      <span><strong><!--__TOTAL__--></strong>
        <span data-pt="jogos no catálogo" data-en="games in the catalog">games in the catalog</span></span>
      <span data-pt="clique e jogue" data-en="click and play">click and play</span>
    </div>
  </header>

  <main>
    <div class="grid">
<!--__GAMES__-->
    </div>
  </main>

  <footer class="footer">
    <p>
      <span data-pt="Código em" data-en="Source at">Source at</span>
      <a href="https://github.com/victorlcampos/slop-games">github.com/victorlcampos/slop-games</a>.
      <span data-pt="Quer adicionar um jogo? As regras da casa estão no" data-en="Want to add a game? The house rules live in">Want to add a game? The house rules live in</span>
      <code>CLAUDE.md</code>.
    </p>
  </footer>

<script>/*__APP__*/</script>
</body>
</html>
