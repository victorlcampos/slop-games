<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Spectrograms — checking the sound</title>
<style>
  body{background:#12131a;color:#e8e8f0;font:13px system-ui;margin:0;padding:14px}
  h1{font-size:15px;margin:0 0 10px}
  .g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .c{background:#1c1e28;border-radius:8px;padding:8px}
  .c b{display:block;font-size:12px;margin-bottom:4px}
  .c small{color:#9aa;font-size:10px}
  canvas{width:100%;display:block;border-radius:4px;image-rendering:pixelated}
</style></head><body>
<h1>Spectrogram — 0 to 5 kHz (where the formants live). Y axis = frequency, X = time.</h1>
<div class="g" id="g"></div>
<!-- These tools load ../src directly, so they need what those files need:
     01_i18n.js provides KEY()/LN() and expects a Slop. A dev page does not have
     the bundle, so it stands in with the little the splitters actually use. -->
<script>
  window.Slop = { createI18n: () => ({ lang: 'en', t: (id) => id, extend() {}, onChange() {} }) };
</script>
<script src="../src/01_i18n.js"></script>
<script src="../src/02_util.js"></script>
<script src="../src/03_species.js"></script>
<script src="../src/04_sprites.js"></script>
<script src="../src/06b_audio.js"></script>
<script>
/* ---- radix-2 FFT ---- */
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i],re[j]]=[re[j],re[i]]; [im[i],im[j]]=[im[j],im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const ur = re[i+k], ui = im[i+k];
        const vr = re[i+k+len/2]*cr - im[i+k+len/2]*ci;
        const vi = re[i+k+len/2]*ci + im[i+k+len/2]*cr;
        re[i+k]=ur+vr; im[i+k]=ui+vi;
        re[i+k+len/2]=ur-vr; im[i+k+len/2]=ui-vi;
        const nc = cr*wr - ci*wi; ci = cr*wi + ci*wr; cr = nc;
      }
    }
  }
}
const SR = 22050, N = 1024, HOP = 128, FMAX = 5000;

async function renderiza(fn, dur) {
  const oc = new OfflineAudioContext(1, Math.ceil(SR * dur), SR);
  SFX.ctx = oc; SFX.on = true; SFX._active = 0; SFX._lastAt = new Map(); SFX._glottis = null;
  SFX.master = oc.createGain(); SFX.master.gain.value = 1;
  const lim = oc.createDynamicsCompressor();
  lim.threshold.value = -12; lim.knee.value = 12; lim.ratio.value = 6;
  SFX.master.connect(lim).connect(oc.destination);
  SFX.far = SFX.master;
  fn();
  const buf = await oc.startRendering();
  return buf.getChannelData(0);
}

function drawPanel(cv, x, title) {
  const cols = Math.floor((x.length - N) / HOP);
  const bins = Math.floor(N * FMAX / SR);
  cv.width = cols; cv.height = bins;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(cols, bins);
  const win = new Float32Array(N);
  for (let i = 0; i < N; i++) win[i] = .5 - .5 * Math.cos(2*Math.PI*i/(N-1));
  let pico = 1e-9;
  const mag = new Float32Array(cols * bins);
  for (let c = 0; c < cols; c++) {
    const re = new Float32Array(N), im = new Float32Array(N);
    for (let i = 0; i < N; i++) re[i] = x[c*HOP+i] * win[i];
    fft(re, im);
    for (let b = 0; b < bins; b++) {
      const m = Math.hypot(re[b], im[b]);
      mag[c*bins+b] = m; if (m > pico) pico = m;
    }
  }
  for (let c = 0; c < cols; c++) for (let b = 0; b < bins; b++) {
    const db = 20 * Math.log10(mag[c*bins+b] / pico);
    const v = Math.max(0, Math.min(1, (db + 62) / 62));   // -62 dB .. 0
    const p = ((bins - 1 - b) * cols + c) * 4;
    // colormap: preto -> azul -> vermelho -> amarelo -> branco
    img.data[p]   = 255 * Math.min(1, Math.max(0, v*2.6 - .55));
    img.data[p+1] = 255 * Math.min(1, Math.max(0, v*2.4 - 1.15));
    img.data[p+2] = 255 * Math.min(1, Math.max(0, v < .5 ? v*2 : 2.2 - v*2.6));
    img.data[p+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  // the long-term envelope: where the energy actually concentrates
  const env = new Float32Array(bins);
  for (let b = 0; b < bins; b++) {
    let s = 0; for (let c = 0; c < cols; c++) s += mag[c*bins+b]*mag[c*bins+b];
    env[b] = Math.sqrt(s / cols);
  }
  // smoothed to find the spectral envelope (not the individual harmonics)
  const W = Math.round(330 * N / SR), sm = new Float32Array(bins);
  for (let b = 0; b < bins; b++) {
    let s = 0, n = 0;
    for (let k = -W; k <= W; k++) { const i = b+k; if (i>=0 && i<bins) { s += env[i]; n++; } }
    sm[b] = s/n;
  }
  // a comparable fingerprint: how much energy lives in each band
  const FX = [[0,500],[500,1500],[1500,3000],[3000,5000]];
  const e = FX.map(([lo,hi]) => {
    let s = 0;
    for (let b = Math.round(lo*N/SR); b < Math.round(hi*N/SR) && b < bins; b++) s += env[b]*env[b];
    return s;
  });
  const tot = e.reduce((a,b)=>a+b,0) || 1;
  const mx = Math.max(...e);
  return FX.map(([lo,hi],i) =>
    (hi/1000) + 'k:' + (100*e[i]/tot).toFixed(0) + '%/' + (10*Math.log10(e[i]/mx)).toFixed(0) + 'dB'
  ).join('  ');
}

const CASOS = [
  ['adult visitor (male)',    1.0, () => SFX.humanVoice({ child:false, look:3, id:7 }, { now:true, vol:.5 })],
  ['adult visitor (female)',  1.0, () => SFX.humanVoice({ child:false, look:11, id:2 }, { now:true, vol:.5 })],
  ['child',                   1.0, () => SFX.humanVoice({ child:true, look:1, id:5 }, { now:true, vol:.5 })],
  ['vogal /a/ isolada',        .6, () => SFX._vowel({ f0:118, vogal:'a', dur:.5, vol:.5, kind:'man' })],
  ['vogal /i/ isolada',        .6, () => SFX._vowel({ f0:118, vogal:'i', dur:.5, vol:.5, kind:'man' })],
  ['/a/ -> /i/ (transition)',  .6, () => SFX._vowel({ f0:118, f0b:150, vowel:'a', vowel2:'i', dur:.5, vol:.5, kind:'man' })],
  ['vet (2 syllables)',       1.0, () => SFX.humanVoice({ child:false, role:'vet', look:4, id:1 }, { now:true, vol:.5 })],
  ['lion (reference OK)',     1.6, () => SFX.animalVoice({ key:'Lion', plan:'feline', scale:1.4 }, { now:true, vol:.6 })],
  ['giraffe (reference OK)',  1.6, () => SFX.animalVoice({ key:'Giraffe', plan:'giraffe', scale:1.8 }, { now:true, vol:.6 })],
];

(async () => {
  const g = document.getElementById('g');
  for (const [name, dur, fn] of CASOS) {
    const d = document.createElement('div'); d.className = 'c';
    d.innerHTML = `<b>${name}</b><small>${dur}s · 0–5 kHz</small>`;
    const cv = document.createElement('canvas'); d.appendChild(cv); g.appendChild(d);
    try { const info = drawPanel(cv, await renderiza(fn, dur), name);
          const e = document.createElement('small'); e.style.color='#7fd';
          e.textContent = 'picos: ' + info; d.appendChild(e); }
    catch (e) { d.innerHTML += `<small style="color:#f88">${e.message}</small>`; }
  }
  document.title = 'pronto';
})();
</script></body></html>
