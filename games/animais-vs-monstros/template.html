<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Animais vs Monstros</title>
<meta name="description" content="Tower defense of Brazilian animals against monsters. Runs entirely in the browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐆</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    /* dvh follows the browser bar on a phone; vh would leave the canvas
       cropped behind it when the bar retracts */
    height: 100dvh;
    min-height: 100%;
    overflow: hidden;
    background: #16130f;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    /* a dark wooden table: the "notebook" sits on top of it */
    background:
      radial-gradient(ellipse 70% 55% at 50% 45%, #2a2119 0%, #16130f 75%);
  }

  /* The canvas fills the window at any aspect ratio. What adapts is the logical
     world: the height is always 720 and the width follows the shape of the
     screen (see src/viewport.js). No letterboxing, no stretching. */
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: default;
    touch-action: none;
  }

  /* only exists for "load save" — the rest of the interface is drawn on the canvas */
  #file { display: none; }

  #booting {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    color: #d9cdb8;
    font-size: 15px;
    letter-spacing: 0.04em;
  }

  /* The board has 9 columns: upright it doesn't fit at all. Instead of
     squeezing it, we ask for a turn — only on a touch device, because in a
     narrow desktop window the canvas still shrinks and stays playable. */
  #rotate {
    display: none;
    position: fixed;
    inset: 0;
    /* A `fixed; inset: 0` without this swallows every touch on the screen if it
       ever becomes visible when it shouldn't — and the orientation media query
       is slow to re-evaluate in some mobile browsers, precisely after a
       rotation. There is nothing clickable here, so ignoring the pointer costs
       nothing. */
    pointer-events: none;
    place-items: center;
    text-align: center;
    padding: 2rem;
    background: radial-gradient(ellipse 70% 55% at 50% 45%, #2a2119 0%, #16130f 75%);
    color: #f2e2c0;
  }

  #rotate .device {
    width: 84px;
    height: 140px;
    margin: 0 auto 1.6rem;
    border: 5px solid #c9a165;
    border-radius: 14px;
    animation: turn 2.4s ease-in-out infinite;
  }

  #rotate h1 { font-size: 1.5rem; margin-bottom: 0.6rem; font-weight: 800; }
  #rotate p { color: #c9b490; font-size: 1rem; max-width: 22rem; margin: 0 auto; }

  @keyframes turn {
    0%, 30% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(-90deg); }
  }

  @media (orientation: portrait) and (pointer: coarse) {
    #stage { display: none; }
    #rotate { display: grid; }
  }

  @media (prefers-reduced-motion: reduce) {
    #rotate .device { animation: none; transform: rotate(-90deg); }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="booting" data-pt="rabiscando o mundo…" data-en="scribbling the world…">rabiscando o mundo…</div>
    <canvas id="canvas" hidden></canvas>
  </div>

  <div id="rotate">
    <div>
      <div class="device"></div>
      <h1 data-pt="Vire o aparelho" data-en="Turn your device">Vire o aparelho</h1>
      <p data-pt="O tabuleiro tem nove colunas de largura — deitado, dá para ver a fileira inteira e o que vem vindo."
         data-en="The board is nine columns wide — in landscape you can see the whole lane and what is coming.">
        O tabuleiro tem nove colunas de largura — deitado, dá para ver a fileira inteira e o que vem vindo.
      </p>
    </div>
  </div>
  <input id="file" type="file" accept="application/json,.json">
<script>/*__APP__*/</script>
</body>
</html>
