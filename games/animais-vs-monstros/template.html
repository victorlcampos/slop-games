<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Animals vs Monsters</title>
<meta name="description" content="Tower defense of Brazilian animals against monsters. Runs entirely in the browser."
      data-pt-content="Tower defense de bichos brasileiros contra monstros. Roda inteiro no navegador."
      data-en-content="Tower defense of Brazilian animals against monsters. Runs entirely in the browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐆</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    /* dvh follows the browser bar on a phone; vh would leave the canvas
       cropped behind it when the bar retracts */
    height: 100dvh;
    min-height: 100%;
    overflow: hidden;
    background: #16130f;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    /* a dark wooden table: the "notebook" sits on top of it */
    background:
      radial-gradient(ellipse 70% 55% at 50% 45%, #2a2119 0%, #16130f 75%);
  }

  /* The canvas fills the window at any aspect ratio. What adapts is the logical
     world: the height is always 720 and the width follows the shape of the
     screen (see src/viewport.js). No letterboxing, no stretching. */
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: default;
    touch-action: none;
  }

  /* only exists for "load save" — the rest of the interface is drawn on the canvas */
  #file { display: none; }

  #booting {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    color: #d9cdb8;
    font-size: 15px;
    letter-spacing: 0.04em;
  }

</style>
</head>
<body>
  <div id="stage">
    <div id="booting" data-pt="rabiscando o mundo…" data-en="scribbling the world…">scribbling the world…</div>
    <canvas id="canvas" hidden></canvas>
  </div>

  <input id="file" type="file" accept="application/json,.json">
<script>/*__APP__*/</script>
</body>
</html>
