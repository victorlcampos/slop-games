<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07070f">
<title>Arcade Classics</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100dvh;
    min-height: 100%;
    overflow: hidden;
    background: #07070f;
    color: #d6f4d6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* Every card sits over the canvas, which keeps painting the arcade behind it. */
  .card {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 4vh 6vw;
    background: radial-gradient(ellipse 80% 70% at 50% 40%, rgba(7,7,15,0.66) 0%, rgba(4,4,10,0.93) 78%);
    text-align: center;
    z-index: 3;
    overflow-y: auto;
  }
  .card[hidden] { display: none; }

  .inner { max-width: 46rem; width: 100%; }

  h1 {
    font-size: clamp(1.8rem, 5.5vw, 3rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7dff8a;
    text-shadow: 0 3px 0 #0a4d1e, 0 0 30px rgba(80,255,120,0.25);
  }

  .tagline { color: #a8d8b0; margin: 0.4rem 0 1.2rem; font-size: clamp(0.9rem, 2.2vw, 1.1rem); }

  /* The seven machines: name, one-line pitch, and the house best. */
  #pick {
    display: grid;
    gap: 0.55rem;
    grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
    margin-bottom: 1.2rem;
    text-align: left;
  }
  .machine {
    font: inherit;
    color: #d6f4d6;
    background: rgba(20,34,22,0.85);
    border: 2px solid #3f7a4a;
    border-radius: 10px;
    padding: 0.6rem 0.8rem;
    cursor: pointer;
    display: grid;
    gap: 0.15rem;
  }
  .machine:active { transform: translateY(2px); }
  .machine b { color: #7dff8a; letter-spacing: 0.03em; }
  .machine span { font-size: 0.82rem; color: #9dc4a4; line-height: 1.35; }
  .machine em { font-style: normal; font-size: 0.75rem; color: #6f9a78; }

  .btnrow { display: flex; gap: 0.7rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1rem; }

  .btn {
    font: inherit;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #06130a;
    background: linear-gradient(#7dff8a, #3fae5c);
    border: 3px solid #020503;
    border-radius: 10px;
    padding: 0.7rem 1.4rem;
    cursor: pointer;
    box-shadow: 0 4px 0 #020503;
  }
  .btn:active { transform: translateY(3px); box-shadow: none; }

  .btn.ghost {
    background: transparent;
    color: #d6f4d6;
    border-color: #3f7a4a;
    box-shadow: none;
  }

  /* The exit only exists inside the catalog — the build switches it on. */
  .back-to-games {
    display: none;
    align-items: center;
    gap: 0.45rem;
    text-decoration: none;
  }
  .back-to-games[hidden] { display: none; }
  .back-to-games:not([hidden]) { display: inline-flex; }

  .foot { color: #6f9a78; font-size: clamp(0.75rem, 1.7vw, 0.88rem); line-height: 1.6; }

  .stats { display: flex; gap: 1.6rem; justify-content: center; margin: 0 0 1.2rem; flex-wrap: wrap; }
  .stat { min-width: 6rem; }
  .stat b { display: block; font-size: clamp(1.4rem, 4vw, 2rem); color: #7dff8a; }
  .stat span { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #6f9a78; }

  .record { color: #ffd88a; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.8rem; }

  .corner {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    right: 0;
    z-index: 4;
    display: flex;
    gap: 0.4rem;
    padding: 0.6rem;
    align-items: center;
  }
  .icon {
    font-size: 1.2rem;
    background: rgba(7,10,7,0.6);
    border: 2px solid #3f7a4a;
    border-radius: 8px;
    color: #d6f4d6;
    padding: 0.25rem 0.5rem;
    cursor: pointer;
  }

  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #6f9a78; z-index: 5; }
  /* `hidden` loses to `display: grid` — without this the line stays on screen
     for the whole run, in the middle of the arcade */
  #boot[hidden] { display: none; }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="boot" data-pt="ligando as máquinas…" data-en="warming up the machines…">warming up the machines…</div>

  <div class="corner">
    <span data-lang-picker></span>
    <button class="icon" id="btn-sound" title="M">🔊</button>
  </div>

  <div class="card" id="menu">
    <div class="inner">
      <h1 data-pt="Clássicos do Arcade" data-en="Arcade Classics">Arcade Classics</h1>
      <p class="tagline"
         data-pt="Sete clássicos, uma ficha. Escolha a máquina."
         data-en="Seven classics, one token. Pick your machine.">Seven classics, one token. Pick your machine.</p>

      <div id="pick"></div>

      <div class="btnrow">
        <a class="btn ghost back-to-games" data-back-to-catalog data-t="slop.backToCatalog" hidden></a>
      </div>

      <p class="foot">
        <span data-pt="Setas ou A/D movem · espaço atira · M silencia · no celular arraste ou deslize"
              data-en="Arrows or A/D move · space fires · M mutes · drag or swipe on a phone">Arrows or A/D move · space fires · M mutes · drag or swipe on a phone</span>
      </p>
    </div>
  </div>

  <div class="card" id="over" hidden>
    <div class="inner">
      <h1 id="o-title">Neon Arcade</h1>
      <p class="record" id="o-record" hidden data-pt="Novo recorde!" data-en="New record!">New record!</p>
      <div class="stats">
        <div class="stat"><b id="o-score">0</b><span data-pt="pontos" data-en="score">score</span></div>
        <div class="stat"><b id="o-best">0</b><span data-pt="recorde" data-en="best">best</span></div>
      </div>
      <div class="btnrow">
        <button class="btn" id="btn-again" data-pt="De novo" data-en="Again">Again</button>
        <button class="btn ghost" id="btn-menu" data-pt="Máquinas" data-en="Machines">Machines</button>
        <a class="btn ghost back-to-games" data-back-to-catalog data-t="slop.backToCatalog" hidden></a>
      </div>
    </div>
  </div>

<script>/*__APP__*/</script>
</body>
</html>
