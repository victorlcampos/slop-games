name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; it does not cancel the one already going out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Builds and tests. The artifact that goes up from here is exactly the one
  # that was tested — the publishing job rebuilds nothing, it only publishes.
  # That way there is no chance of shipping a build different from the one that
  # passed.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the games and the index
        run: npm run build

      - name: Unit and catalog tests
        run: npm test

      # Every game's own test, and none of them opens a browser: the runner has
      # no graphics card, and a scenario that played a 3D game there measured
      # SwiftShader instead of the code. What plays the games now is Node —
      # the physics, the catalogue, the battle and the street index are all
      # plain functions (CLAUDE.md, section 6).
      - name: Each game's own tests
        run: npm run test --workspaces --if-present

      - name: Package the tested dist
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # ---------------------------------------------------------------------------
  # Only publishes if the tests passed, and only from main.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
