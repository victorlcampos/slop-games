name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; it does not cancel the one already going out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Builds and tests. The artifact that goes up from here is exactly the one
  # that was tested — the publishing job rebuilds nothing, it only publishes.
  # That way there is no chance of shipping a build different from the one that
  # passed.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `puppeteer-core` does not download a browser (that is what keeps this
      # repository light), so Chrome comes from the runner. slopkit's
      # `findChrome` locates it on its own; this step exists to fail with a
      # clear message the day it goes missing.
      - name: Check the runner's Chrome
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::no Chrome on the runner — the browser tests cannot run"
            exit 1
          fi
          echo "Chrome at $CHROME_PATH — $("$CHROME_PATH" --version)"

      - name: Build the games and the index
        run: npm run build

      - name: Unit and catalog tests
        run: npm test

      # The 2D games are played here from end to end. The 3D ones are not: this
      # runner has no GPU, SwiftShader draws SkiFree at about one frame every
      # three seconds, and a scenario that holds the throttle measures the
      # graphics card instead of the game. They get the floor above, and a lap
      # by hand before a deploy.
      - name: Each game's own tests
        run: npm run test --workspaces --if-present

      # This one really drives on a real OpenStreetMap map. It is a good test
      # and a terrible gate: it depends on a third-party public API that goes
      # down and rate-limits. It runs for visibility, without being able to
      # block the deploy.
      - name: Network integration test (non-blocking)
        continue-on-error: true
        run: npm run test:network --workspace games/worlddrive

      # when something breaks, the screenshot is worth more than the log
      - name: Keep the screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots
          path: |
            games/*/test/*.png
            test/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Package the tested dist
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # ---------------------------------------------------------------------------
  # Only publishes if the tests passed, and only from main.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
